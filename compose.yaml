name: sistemapdv-local

x-app: &app
  image: sistemapdv-backend:local
  build:
    context: .
    dockerfile: bar-management-system/Dockerfile
  environment:
    NODE_ENV: production
    DB_HOST: database
    DB_USER: postgres
    PLATFORM_CONFIG_FILE: /state/platform.json

services:
  prepare:
    <<: *app
    user: root
    command: [node, /app/docker/local.cjs, prepare]
    volumes:
      - install_secrets:/secrets
      - platform_data:/state
    restart: "no"

  database:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD_FILE: /secrets/postgres-password
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - install_secrets:/secrets:ro
    depends_on:
      prepare:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  provision:
    <<: *app
    command: [node, /app/docker/local.cjs, provision]
    volumes:
      - install_secrets:/secrets:ro
      - platform_data:/state
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *app
    volumes:
      - platform_data:/state:ro
    depends_on:
      provision:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  frontend:
    build: ./bar-frontend
    ports:
      - "127.0.0.1:${PDV_LOCAL_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget -Y off -T 2 -q -O /dev/null http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
  platform_data:
  install_secrets:
